<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bug-Code</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="panel" id="editor-panel">
    <h2>🪵 Bark Beetle CAM</h2>
    <div class="telemetry">
      X: <span id="tele-x">0.00</span>
      Y: <span id="tele-y">0.00</span>
      Z: <span id="tele-z">5.00</span>
    </div>
    <div class="preset-bar">
      <button class="btn-preset" onclick="loadPreset('straight')">1. Straight Lines</button>
      <button class="btn-preset" onclick="loadPreset('diagonal')">2. Diagonal Lines</button>
      <button class="btn-preset" onclick="loadPreset('arcs')">3. Arcs & Arches</button>
      <button class="btn-preset" onclick="loadPreset('depth')">4. Z-Depth Digging</button>
    </div>
    <textarea id="gcode" spellcheck="false">
; --- Bark Beetle CNC Test ---
; Safe Z is Z > 0 (Flying)
; Cutting Z is Z <= 0 (Digging)

G00 X20 Y20 Z5    ; Rapid to start pos
G01 Z-2 F200      ; Plunge into wood!

; Carve a square pocket
G01 X100 Y20 F400
G01 X100 Y100
G01 X20 Y100
G01 X20 Y20

; Retract and rapid to arc start
G00 Z5
G00 X150 Y50
G01 Z-3 F200

; Cut a smooth arc (G02)
G02 X200 Y100 I25 J25 F300

G00 Z5            ; Retract safely
    </textarea>
    <div class="controls">
      <button id="run">▶ Run G-Code</button>
      <button id="reset">↺ Reset Bed</button>
    </div>
  </div>

  <div class="panel" id="view-panel">
    <canvas id="cncCanvas" width="600" height="600"></canvas>
  </div>

<script src="script.js"></script>
</body>
</html>
